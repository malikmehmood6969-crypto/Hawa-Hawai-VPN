name: Build Hawa Hawai V2 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V2 source
        run: unzip -o source-v2.zip

      - name: Build V2 APK
        run: gradle --no-daemon assembleDebug

      - name: Upload V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Hawa-Hawai-V2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
